---

- name: Create Prometheus group
  group:
    name: prometheus
    state: present
  become: yes

- name: Create Prometheus user
  user:
    name: prometheus
    system: true
    shell: "/bin/false"
    group: prometheus
    createhome: true 
    home: "{{ prometheus_db_dir }}"
  become: yes

- name: Create Prometheus config dir
  file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    recurse: yes
    owner: prometheus
    group: prometheus
    mode: 0770
  become: yes

- name: Get Prometheus tarball
  get_url:
    url: "{{ prometheus_release_url }}"
    dest: /tmp
    checksum: "sha256:{{ prometheus_tarball_checksum }}"
  delegate_to: localhost

- name: Extract Prometheus tarball
  unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp
    copy: yes

- name: Copy Prometheus binaries
  copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "{{ prometheus_bin_dir }}/{{ item }}"
    remote_src: yes
    mode: 0755
    owner: prometheus
    group: prometheus
  with_items:
    - prometheus
    - promtool
  become: yes

- name: Copy Prometheus configs
  copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "{{ prometheus_config_dir }}/{{ item }}"
    remote_src: yes
    mode: 0755
    owner: prometheus
    group: prometheus
  with_items:
    - consoles
    - console_libraries
  become: yes

- name: Deploy Prometheus systemd unit 
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: 0644
  become: yes

- name: Start and enable on boot service
  systemd:
    name: prometheus
    daemon-reload: yes
    enabled: yes
    state: started
  become: yes

- name: Deploy Prometheus config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: 0644
  become: yes
  notify: Restart Prometheus

- name: Install Grafana install dependancies
  apt:
    pkg:
    - apt-transport-https
    - software-properties-common
  become: yes

- name: Add Grafana Apt signing key
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present
  become: yes

- name: Add Grafana repository
  apt_repository:
    repo: deb https://packages.grafana.com/enterprise/deb stable main
    state: present
  become: yes

- name: Install the build dependencies for package "foo"
  apt:
    pkg: grafana
    update_cache: yes
  become: yes

- name: Start and enable on boot service
  systemd:
    name: grafana-server
    daemon-reload: yes
    enabled: yes
    state: started
  become: yes


